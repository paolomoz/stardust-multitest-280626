<style>
  header.header { background: #000; color: #fff; }
  .sony-hd { display: flex; align-items: center; gap: 28px; height: 64px; max-width: 1400px; margin-inline: auto; padding-inline: 24px; }
  .sony-hd .brand { display: flex; align-items: center; flex-shrink: 0; }
  .sony-hd .brand svg { height: 18px; width: auto; fill: #fff; display: block; }
  .sony-hd nav { display: flex; gap: 22px; flex: 1; flex-wrap: wrap; }
  .sony-hd nav a { font-size: 14px; color: #e8e8e8; padding: 6px 0; position: relative; transition: color 0.2s; }
  .sony-hd nav a:hover { color: #fff; }
  .sony-hd nav a::after { content: ""; position: absolute; left: 0; bottom: 0; height: 1px; width: 100%; background: #fff; transform: scaleX(0); transform-origin: left; transition: transform 0.25s cubic-bezier(0.16,1,0.3,1); }
  .sony-hd nav a:hover::after { transform: scaleX(1); }
  .sony-hd .hd-actions { display: flex; gap: 16px; align-items: center; font-size: 13px; color: #cfcfcf; flex-shrink: 0; }
  .sony-hd .hd-actions a:hover { color: #fff; }
  .sony-burger { display: none; background: none; border: 0; color: #fff; font-size: 22px; cursor: pointer; line-height: 1; margin-left: auto; }
  #sony-nav-toggle { display: none; }
  @media (max-width: 860px) {
    .sony-hd nav, .sony-hd .hd-actions { display: none; }
    .sony-burger { display: block; }
    #sony-nav-toggle:checked ~ .sony-hd nav { display: flex; position: absolute; top: 64px; left: 0; right: 0; flex-direction: column; background: #000; padding: 16px 24px; gap: 4px; z-index: 90; border-top: 1px solid #333; }
  }
</style>
<input type="checkbox" id="sony-nav-toggle" aria-hidden="true">
<div class="sony-hd">
  <a class="brand" href="/sony/" aria-label="Sony Group Portal home">
    <svg viewBox="0 0 500 88" role="img" aria-label="SONY"><text x="0" y="68" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="700" letter-spacing="4" fill="#fff">SONY</text></svg>
  </a>
  <nav aria-label="Primary">
    <a href="/sony/products">Businesses &amp; Products</a>
    <a href="/sony/about">About Sony Group</a>
    <a href="/sony/technology">Technology</a>
    <a href="/sony/sustainability">Sustainability</a>
    <a href="/sony/design">Design</a>
    <a href="/sony/careers">Careers</a>
    <a href="/sony/investor-relations">Investor Relations</a>
  </nav>
  <div class="hd-actions"><a href="/sony/contact">Contact</a></div>
  <label class="sony-burger" for="sony-nav-toggle" aria-label="Toggle navigation menu">&#9776;</label>
</div>
