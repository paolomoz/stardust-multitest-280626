<style>
header.header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.94);backdrop-filter:saturate(160%) blur(8px);border-bottom:1px solid var(--surface-alt)}
header.header .hdr-row{max-width:var(--maxw);margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:24px;height:72px}
header.header .brand-logo img{height:30px;width:auto;display:block}
header.header .aud-toggle{display:flex;gap:4px;background:var(--surface);border-radius:999px;padding:4px}
header.header .aud-toggle a{font-family:var(--font-head);font-weight:600;font-size:.9rem;color:var(--ink-muted);padding:7px 16px;border-radius:999px;text-decoration:none}
header.header .aud-toggle a[aria-current="true"]{background:#fff;color:var(--brand-deep);box-shadow:var(--sh-1)}
header.header .main-nav{display:flex;gap:26px;margin-left:8px}
header.header .main-nav a{color:var(--ink);font-weight:500;font-size:.98rem;text-decoration:none}
header.header .main-nav a:hover{color:var(--brand-bright)}
header.header .hdr-actions{margin-left:auto;display:flex;align-items:center;gap:14px}
header.header .hdr-actions .login{color:var(--ink);font-family:var(--font-head);font-weight:600;font-size:.95rem;text-decoration:none}
header.header #pp-mnav-toggle{position:absolute;opacity:0;pointer-events:none}
header.header .pp-burger{display:none;margin-left:auto;cursor:pointer;width:44px;height:44px;flex-direction:column;justify-content:center;gap:5px}
header.header .pp-burger span{display:block;height:2px;width:24px;background:var(--ink);border-radius:2px}
header.header .pp-drawer{display:none}
@media (max-width:900px){
  header.header .main-nav,header.header .aud-toggle{display:none}
  header.header .pp-burger{display:flex}
  header.header #pp-mnav-toggle:checked ~ .pp-drawer{display:flex;position:fixed;inset:72px 0 0;z-index:200;background:#fff;padding:24px;flex-direction:column;gap:4px;overflow:auto}
  header.header .pp-drawer a{font-family:var(--font-head);font-weight:600;font-size:1.1rem;color:var(--ink);padding:14px 4px;border-bottom:1px solid var(--surface-alt);text-decoration:none}
}
</style>
<div class="hdr-row">
  <a class="brand-logo" href="/paypal" aria-label="PayPal home"><img src="https://www.paypalobjects.com/webstatic/i/logo/rebrand/ppcom.svg" alt="PayPal"></a>
  <div class="aud-toggle">
    <a href="/paypal" aria-current="true">Personal</a>
    <a href="/paypal/business">Business</a>
  </div>
  <nav class="main-nav" aria-label="Primary">
    <a href="/paypal/digital-wallet">Personal Banking</a>
    <a href="/paypal/digital-wallet">Send &amp; Request</a>
    <a href="/paypal/business">Business</a>
    <a href="/paypal/help">Help</a>
  </nav>
  <div class="hdr-actions">
    <a class="login" href="https://www.paypal.com/signin">Log In</a>
    <a class="btn btn-primary" href="https://www.paypal.com/welcome/signup">Sign Up</a>
  </div>
  <input type="checkbox" id="pp-mnav-toggle" aria-hidden="true">
  <label class="pp-burger" for="pp-mnav-toggle" aria-label="Menu"><span></span><span></span><span></span></label>
  <nav class="pp-drawer" aria-label="Mobile">
    <a href="/paypal">Personal</a>
    <a href="/paypal/business">Business</a>
    <a href="/paypal/digital-wallet">Personal Banking</a>
    <a href="/paypal/help">Help</a>
    <a href="https://www.paypal.com/signin">Log In</a>
    <a href="https://www.paypal.com/welcome/signup">Sign Up</a>
  </nav>
</div>
